<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: system-ui, sans-serif; background: #eef2ff; color: #1e293b; }
    main { width: min(100%, 380px); padding: 28px; border-radius: 20px; background: white; box-shadow: 0 16px 40px #3341551a; }
    h1 { margin: 0 0 24px; font-size: 1.5rem; }
    form { display: grid; gap: 12px; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; }
    button { border: 0; background: #4f46e5; color: white; cursor: pointer; font-weight: 600; }
    button:hover { background: #4338ca; }
    output { display: block; min-height: 3em; padding: 12px; border-radius: 10px; background: #f1f5f9; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
  <h1>Калькулятор</h1>
  <form id="calculator">
    <input id="first" type="number" step="any" required aria-label="Первое число">
    <select id="operation" aria-label="Операция">
      <option value="+">+</option>
      <option value="-">−</option>
    </select>
    <input id="second" type="number" step="any" required aria-label="Второе число">
    <button type="submit">Посчитать</button>
    <output id="result" aria-live="polite">Результат появится здесь</output>
  </form>
  </main>
  <script>
    document.getElementById('calculator').addEventListener('submit', (event) => {
      event.preventDefault();
      const first = Number(document.getElementById('first').value);
      const second = Number(document.getElementById('second').value);
      const operation = document.getElementById('operation').value;
      document.getElementById('result').value = operation === '+' ? first + second : first - second;
    });
  </script>
</body>
</html>
