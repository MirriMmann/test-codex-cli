<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Квиз о животных</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #eef7ef; color: #20352a; }
    main { max-width: 560px; margin: 30px auto; padding: 28px; background: white; border-radius: 20px; box-shadow: 0 12px 35px #20352a1a; }
    h1 { margin-top: 0; }
    fieldset { margin: 18px 0; padding: 16px; border: 1px solid #c8ddca; border-radius: 10px; }
    legend { font-weight: 600; }
    label { display: block; padding: 5px 0; }
    button { padding: 12px 20px; border: 0; border-radius: 10px; background: #287a45; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1c6034; }
    output { display: block; margin-top: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Квиз о животных 🐾</h1>
    <p>Выбери ответ на каждый из трёх вопросов.</p>
    <form id="quiz">
      <fieldset>
        <legend>1. Какое животное самое большое на Земле?</legend>
        <label><input type="radio" name="largest" value="elephant" required> Слон</label>
        <label><input type="radio" name="largest" value="whale"> Синий кит</label>
        <label><input type="radio" name="largest" value="giraffe"> Жираф</label>
      </fieldset>
      <fieldset>
        <legend>2. Кто умеет летать?</legend>
        <label><input type="radio" name="fly" value="penguin" required> Пингвин</label>
        <label><input type="radio" name="fly" value="ostrich"> Страус</label>
        <label><input type="radio" name="fly" value="bat"> Летучая мышь</label>
      </fieldset>
      <fieldset>
        <legend>3. Какое животное носит детёныша в сумке?</legend>
        <label><input type="radio" name="pouch" value="kangaroo" required> Кенгуру</label>
        <label><input type="radio" name="pouch" value="fox"> Лиса</label>
        <label><input type="radio" name="pouch" value="bear"> Медведь</label>
      </fieldset>
      <button type="submit">Проверить ответы</button>
      <output id="result" aria-live="polite"></output>
    </form>
  </main>
  <script>
    document.getElementById('quiz').addEventListener('submit', (event) => {
      event.preventDefault();
      const answers = new FormData(event.currentTarget);
      const correct = { largest: 'whale', fly: 'bat', pouch: 'kangaroo' };
      const score = Object.entries(correct).filter(([question, answer]) => answers.get(question) === answer).length;
      document.getElementById('result').textContent = 'Правильных ответов: ' + score + ' из 3';
    });
  </script>
</body>
</html>
